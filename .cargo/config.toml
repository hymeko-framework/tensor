# Enable SSE4.1 on x86_64 — load-bearing for `hymeko_spline`.
#
# `f32::floor` has no baseline-x86-64 instruction, so `u.floor()` in the
# Catmull-Rom forward compiles to a libm call: 3.71 % of samples in the KAN
# profile, 4.36 % in HSiKAN (2026-08-17). With SSE4.1 it is one `roundss`, worth
# ~10 % on KAN and ~5.6 % on HSiKAN end-to-end.
#
# A cargo config applies to the workspace being built. These kernels used to live
# in `nagare/`, which carries the same stanza; moving them here without this file
# would have silently reinstated the libm call. That was the named Risk 1 of the
# move — no test can catch it, only the benchmark.
#
# Numerics unchanged: `roundss` in floor mode is exactly IEEE floor, verified by
# bit-identical metrics across the flag.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+sse4.1"]
