[package]
name = "hymeko_tensor"
version = "0.1.0"
edition = "2021"
description = "Tensor storage, numerical kernels, scalar contracts and matrix-based information estimators"
license = "MIT OR Apache-2.0"

[lib]
name = "hymeko_tensor"

[features]
default = []
sparse = ["dep:rayon"]
interop = ["sparse", "dep:nalgebra", "dep:nalgebra-sparse", "dep:num-traits"]
arrow-schema = ["dep:arrow"]

[dependencies]
rayon = { version = "1.11.0", optional = true }
nalgebra = { version = "0.34.1", optional = true }
nalgebra-sparse = { version = "0.11.0", optional = true }
num-traits = { version = "0.2.19", optional = true }
arrow = { version = "58.0.0", optional = true }

[dev-dependencies]
blake3 = "1.8.3"
criterion = { version = "0.8.2", default-features = false }

[[test]]
name = "sparse_authority"
required-features = ["sparse"]

[[test]]
name = "sparse_workload_kat"
required-features = ["sparse"]

[[bench]]
name = "csr_bench"
harness = false
required-features = ["sparse"]
test = false
