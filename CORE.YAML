# CORE.YAML — the `tensor` repository IS the HyMeKo framework
#
# Scoped to paths inside this repository, so it is meaningful in a standalone clone. The
# workspace-root copy (which is not in any git repo — the root is not a repository) lists the
# same crates with workspace-relative paths; this one is authoritative for `tensor`.
#
# CONTRACT (CLAUDE.md §1): every item below is read-only by default. A task that requires
# modifying one must STOP, produce a written justification and a migration plan, and wait for
# explicit approval. A workaround in the consuming application is always preferred over a
# "small" core edit. Adding, removing or upgrading a dependency is treated the same way.
#
# Established by the 2026-08-19 architecture audit
# (`../nagare/reports/2026-08-19-architecture-audit.md` §B-bis) and the integration that followed
# (`../nagare/reports/2026-08-19-framework-integration.md`).

core:
  # Algebra: rotors, multivectors, adjoint autodiff.
  # The reference standard of the whole project: `forbid(unsafe_code)`, a 0.97:1 test-to-source
  # ratio across six NAMED SCENARIO suites, the densest Design-by-Contract docs anywhere in the
  # codebase, zero production `unwrap`/`expect`. Deliberately dependency-free — keep it that way.
  #
  # `algebra/connection.rs` added 2026-08-31: discrete-connection gauge fixing (tree transport,
  # cotree loop-closure residuals, curvature energy), transcribed from `nagare`'s
  # `holonomy_estimator.rs` — the measured component behind finding F-HOLO-3, where a closed-form
  # curvature readout reached oracle-level separation on a task a strong MLP could not. The same
  # argument that brought `rotor_holonomy_forward` here: the topology arrives as PLAIN SLICES, so
  # this is rotor algebra over an ordered structure and carries no graph type, mesh, dataset or
  # model concept. The wheel generator, the sampler and the classification metric stayed on the
  # application side; `tests/connection.rs` rebuilds a wheel of its own to check the identity.
  #
  # The physical reading is why it is here rather than left in a backup: on a mesh the deviation of
  # a plaquette holonomy from the identity IS the flux through that cell, gauge fixing IS the choice
  # of spanning tree, and a divergence-free constraint becomes an identity the representation
  # already satisfies rather than one to enforce.
  #
  # `algebra/se_fixed.rs` added 2026-09-01: SE(n) with the dimension supplied at compile time, so a
  # rigid motion lives on the stack instead of in two `Vec<f64>`s. Measured motive: forward
  # kinematics over a 33-link quadruped spends about seventy per cent of its time in ~1200
  # allocations, and nothing about the algebra asks for them.
  #
  # ONE GENERIC BODY, not a second implementation. `Se3` is the alias `SeFixed<Dim3>`; the group law
  # is written once against `EuclideanDim`, which carries n and the two array types because stable
  # Rust cannot yet spell `[f64; 1 << N]`. Only the constructors that NAME axes are
  # dimension-specific. `tests/se_fixed.rs` exercises SE(2) through the same body precisely so that a
  # three-dimensional implementation dressed as generic could not pass.
  #
  # `algebra/se_fixed.rs` blade table, 2026-09-02: the geometric product was recomputing the blade
  # sign for every term, with two bit loops (`leading_zeros`, a mask, `count_ones`) per call. A rotor
  # product is sixteen terms and a sandwich over forty; measured, `compose` was 131 ns and a pose
  # walk over a 33-link mechanism 5.3 us -- the largest single cost in a physics step, larger than
  # the dynamics it fed.
  #
  # BIT-IDENTICAL BY CONSTRUCTION, which is the only reason it is allowed here. `blade_product`
  # answers two things: the result blade, which is `a ^ b` and always was; and the sign, which is the
  # reordering parity times the square of each shared basis vector. This type's signature is
  # `Signature::euclidean`, where every basis vector squares to `+1`, so that second factor is a
  # product of ones and dropping it is exact. What remains is a function of two bit patterns, so it
  # is a compile-time table. The loop, the order and the accumulation in `geo` are untouched --
  # only the way `(index, sign)` is obtained changed. `tests/se_fixed.rs` is what checks the claim.
  #
  # `compose` 131 -> 36.8 ns, `rotate` 85.7 -> 26.6, the general rotation matrix 200.4 -> 69.3.
  #
  # `algebra/spatial.rs` added 2026-09-01: spatial vectors — `Twist`, `Wrench`, `SpatialInertia`,
  # `ArticulatedInertia`. The Lie algebra of the group this crate already carries, in the crate that
  # carries the group. Nothing in it knows what a link, a joint or a robot is: a twist is the
  # derivative of an `Se3` along a curve, a wrench is its dual under the pairing that gives power,
  # and a spatial inertia is the metric between them.
  #
  # Measured motive: forward dynamics was assembling `M = sum_i m_i J_i^T J_i` from finite-difference
  # Jacobians and solving it densely — `2n+1` kinematics passes, an n^2 assembly, an n^3 solve, for a
  # coupling the topology already stated exactly. With this algebra the consumer
  # (`hymeko_geometry::articulated`) sweeps the tree instead: 1.39/1.85/4.86 us against
  # 34.29/48.27/324.41 us on a 9/13/33-link robot, and linear in the links (~0.147 us each) where
  # the matrix path was not.
  #
  # Extended 2026-09-01 with the exponential map, `Twist::exp` and `Se3::log` — the missing
  # fundamental operation of the group. A constant screw motion integrated in closed form, so a pose
  # advanced as `X.compose(&(v.scale(dt)).exp())` lands EXACTLY on SE(3) at any step size instead of
  # leaving it and being renormalised. Checked against a scaling-and-squaring matrix exponential that
  # shares no code with it, across eleven decades of rotation angle, plus the one-parameter subgroup
  # law and ten thousand composed steps with the rotor still unit to 1e-12.
  #
  # `rotation_of` is a PRIVATE quaternion-form rotation matrix, deliberately not a replacement for
  # `SeFixed::rotation_matrix_into`, whose bit-for-bit contract with `Se` is worth more than the
  # speed. The general method answers by rotating each basis vector, and each of those is a rotor
  # sandwich — two geometric products over eight-component multivectors, ~128 multiplies, ~384 for
  # the three columns. That measured as the single largest cost in a spatial frame change, larger
  # than the congruence it was being computed for. The quaternion form is ~20, and replacing it
  # (with the vector transforms too) took forward dynamics from 4.65/6.75/17.62 us to
  # 1.39/1.85/4.86 -- 3.3x to 3.6x from one change. A unit test holds the two to rounding.
  #
  # TESTED AS IDENTITIES, not against recorded numbers, because a wrong sign in a spatial transform
  # produces a plausible six-vector rather than an error: power is invariant under a change of frame,
  # the two cross products are dual (`(a x b).f == -b.(a x* f)`), the bracket obeys Jacobi, a point
  # mass's momentum is the one Newton would write, and transforming an inertia equals transforming
  # what it acts on. `tests/spatial.rs`, nine suites.
  #
  # BIT-IDENTICAL to `Se`, and tested as such rather than to a tolerance: same loop bounds, same
  # skip-if-zero guards, same accumulation order. Floating-point addition is not associative, so a
  # faster summation order would be a different function, and a consumer holding a recorded pose
  # would watch it move.
  - hymeko_clifford

  # Spline activation kernels — on the measured hot path of every KAN and HSiKAN run.
  # The only place in the project where the determinism contract is both STATED and ENFORCED:
  # `catmull_rom.rs::{forward,backward}_is_byte_identical_across_thread_counts`, plus
  # `tests/scenario_feature_parity.rs` for the `parallel` on/off half. `rayon` is optional by
  # design so the crate is dependency-free with the feature off; do not make it mandatory.
  - hymeko_spline

  # Signed graphs, incidence, cycle enumeration.
  # Core by role, but NOT currently clean: 219 `fmt` diff hunks across 21 files, and 12 `clippy` errors, all pre-existing
  # as of 2026-08-19. Core status is about protection, not about being finished. Cleaning it is a
  # separate, approved job — not something to fold into an unrelated change.
  - hymeko_graph

  # Vision primitives: skeleton rasterisation and pixel masking.
  # Added 2026-08-24 by explicit authorisation, carrying ONLY the bit-identical rasterisation and
  # masking operators moved out of `nagare/src/vision/skeleton_render.rs`. They have no HyMeKo-
  # specific semantics -- their argument types are `[f32; 2]`, `[usize; 2]` and `&mut [f32]` -- which
  # is what made them core-worthy rather than merely shared. A §6.1 discovery pass over all four
  # existing crates found no owner (`hymeko_graph/src/quadtree.rs` is a spatial subdivision, not a
  # rasteriser).
  #
  # DEPENDENCY-FREE BY CONTRACT, on the `hymeko_clifford` standard: `forbid(unsafe_code)`, no
  # production `unwrap`/`expect`, Design-by-Contract docs on every public item, and an EMPTY
  # `[dependencies]` table. Adding a dependency here is a CORE.YAML change requiring separate
  # approval -- the same protection `hymeko_spline`'s optional `rayon` has.
  #
  # SCOPE IS DELIBERATELY NARROW. The authorisation was for these operators "initially and
  # exclusively". The pose generators, skeleton incidence, bone-length penalty and coordinate
  # refiner that sit beside them in `nagare` are NOT here and must not be folded in as an extension
  # of this grant; each is a new proposal.
  #
  # Equivalence is not asserted, it is measured: the crate carries verbatim transcriptions of the
  # two retired `nagare` renderer bodies, and all four `nagare` pose study tests -- each a
  # 1600-iteration training run asserting recorded pixel errors -- reproduce through it.
  # See `../nagare/reports/2026-08-24-hymeko-vision-core-crate.md`.
  - hymeko_vision

  # Numeric scalar contracts, COO/CSR storage and kernels, initialization,
  # interop, HyMeKoStream layout and matrix-based Rényi-2 estimators.
  # User-authorized 2026-09-23: numeric code and tests moved from Core.
  # Default production build remains dependency-free; sparse enables Rayon,
  # interop enables Nalgebra/num-traits, arrow-schema enables Arrow.
  # Migration ledger: ../core/docs/hymeko-kernel-ownership.md.
  # Was an orphan (zero reverse dependencies) until 2026-08-19, while six of its `renyi.rs`
  # functions sat copied inside `nagare/examples/nagare_deep_signed.rs`. Now linked by `nagare`,
  # and the copies are retired. Keep it the single source of truth — do not re-copy from it.
  - hymeko_tensor

  # Matrix-free iterative solvers for shifted skew-symmetric systems.
  # Added 2026-08-31 by explicit instruction ("the tensor repo should own this — general
  # mathematical things go there"), carrying the three solvers written for the structure-preserving
  # port-Hamiltonian step: Neumann/Richardson, GMRES, and conjugate gradients on the normal
  # equations. Its public surface is a trait over `&[f64]` and three functions, with no mesh, no
  # physics and no HyMeKo semantics in any argument type — the same test that made `hymeko_vision`
  # core-worthy rather than merely shared.
  #
  # A §6.1 discovery pass found one near-owner and REJECTED it on contract, not on taste.
  # `hymeko_tensor::linalg` is also matrix-free and also generic, but its pinned contract is `f32`
  # throughout with no `f64` promotion (consumers reproduce recorded numbers through it), and both
  # of its solvers require SPD — which is precisely what a shifted skew matrix is not. Widening
  # either would change a contract other code depends on, to serve a caller that needs neither.
  # `hymeko_numeric_vv` was rejected for the opposite reason: it is a downstream verification client
  # by construction and owns no kernels.
  #
  # DEPENDENCY-FREE BY CONTRACT, on the `hymeko_clifford` standard: `forbid(unsafe_code)`, no
  # production `unwrap`/`expect`, an EMPTY `[dependencies]` table. Adding a dependency here is a
  # CORE.YAML change requiring separate approval.
  #
  # SCOPE IS DELIBERATELY NARROW: solvers for `(I - θS)x = b`. The discrete gradient scheme that
  # produces those systems, the port-Hamiltonian model behind it and the discretisation around it
  # are NOT here and must not be folded in as an extension of this grant; each is a new proposal.
  #
  # The convergence claims are measured, not asserted: `tests/solver.rs` runs a scalable staggered
  # Maxwell chain and pins the iteration count against the count the geometry predicts, its
  # independence from the size of the system, and both iterative answers against a dense
  # factorisation.
  #
  # ZERO REVERSE DEPENDENCIES as of 2026-08-31, deliberately. The caller these were written for is
  # the SPATIAL port-Hamiltonian step, which does not exist yet; today's model is four states and a
  # 4x4 direct solve is both cheaper and exact. `hymeko_simulator` therefore does NOT link this, and
  # adding an unused dependency to make the graph look tidier would be the wrong trade. Recorded
  # here because `hymeko_tensor` sat orphaned for months while copies of it lived in an example —
  # an orphan that is known is a different thing from one that is not.
  - hymeko_numerics
  #
  # `port_hamiltonian.rs` added 2026-09-02: port-Hamiltonian systems whose interconnection `J` is the
  # signed incidence of a HYPERGRAPH rather than a matrix somebody wrote down. Each port contributes
  # `w (e_u e_v^T - e_v e_u^T)` over its sources and targets, which is antisymmetric term by term, so
  # skew-symmetry — and with it the energy balance — is a consequence of the G-SPHF sign convention
  # (`-1` source, `+1` target) rather than a property checked afterwards.
  #
  # It belongs here and not in an application because the argument types are `&[f64]` and index
  # lists, and because the system it steps is exactly the shifted skew-symmetric one this crate's
  # solvers were written for: `S = Q^(1/2)(J - R)Q^(1/2)`, which the crate doc already named before
  # anything produced it.
  #
  # The unification is TESTED, not asserted. `tests/port_hamiltonian.rs` shows a three-edge chain
  # reproducing, entry for entry, the 4x4 that `hymeko_simulator`'s driven-RLC reduction writes by
  # hand; and canonical mechanics coming out as a perfect matching, `J = [[0, I], [-I, 0]]`. The
  # simulator pins the same correspondence from its own side against the sign rule written out, so
  # neither can drift without one of the two failing.


  # Build contract. `+sse4.1` makes `f32::floor` one `roundss` instead of a libm call in the
  # spline forward: ~10% on KAN, ~5.6% on HSiKAN. This file was UNTRACKED until 2026-08-19 and
  # its loss was undetectable; `hymeko_spline/tests/build_contract.rs` now fails loudly without it.
  - .cargo/config.toml

# Consumers. `nagare` links hymeko_clifford, hymeko_graph, hymeko_spline, hymeko_tensor and
# hymeko_vision by path.
# A breaking change to any public API above is a breaking change to the application — check
# `nagare` builds before proposing one.
consumers:
  - ../nagare

